name: External links

on:
  schedule:
    - cron: '0 6 * * 1' # segunda-feira, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check external Pages sites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HEAD project sites and sitemaps
        run: |
          set -uo pipefail
          failed=0
          for url in \
            "https://thepaneb.github.io/" \
            "https://thepaneb.github.io/vscode-utplsql/" \
            "https://thepaneb.github.io/vscode-utplsql/sitemap.xml" \
            "https://thepaneb.github.io/isis-report-lib/" \
            "https://thepaneb.github.io/isis-report-lib/sitemap.xml"; do
            code=$(curl -sS -L --retry 3 --retry-delay 5 --retry-all-errors \
              --max-time 30 -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "$code $url"
            if [ "$code" != "200" ]; then
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed URL(s) fora do ar"
            exit 1
          fi
          echo "todas as URLs responderam 200"
